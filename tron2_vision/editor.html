<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top 前景修正</title>
<style>
body{background:#15191e;color:#e8edf2;font:15px system-ui;margin:24px}h1{font-size:23px;margin:0 0 12px}button,select,input{font:inherit;border:1px solid #647080;border-radius:5px;padding:7px;background:#252d37;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}#views{display:flex;gap:16px;flex-wrap:wrap}canvas{max-width:100%;height:auto;background:black;touch-action:none;outline:1px solid #607080}#message{min-height:24px;color:#9edac0}p{max-width:1100px;color:#bac6d0;line-height:1.7}.accent{background:#256e51}label{white-space:nowrap}.view{width:min(640px,100%)}.view>div{margin:6px 0;color:#bac6d0}
</style>
<h1>Top 前景修正</h1>
<p>在左图修改选区，右图实时显示黑背景结果。只标注可见的机械左手和任务物体；原始 RGB 保持不变。灰色初始标签需要逐帧检查。鼠标拖动涂抹，Shift＋拖动临时擦除；多边形模式逐点点击，按 Enter 填充，Esc 取消。</p>
<div class="bar"><button id="prev">上一帧</button><select id="frames" aria-label="选择帧"></select><button id="next">下一帧</button><span id="identity"></span></div>
<div class="bar"><select id="cls" aria-label="标签"><option value="1">绿色：机械左手（含黑色关节）</option><option value="2">橙色：任务杯子</option><option value="0">擦除：背景／人手／外骨骼</option></select><select id="mode" aria-label="画笔模式"><option value="brush">画笔</option><option value="polygon">多边形</option></select><label>画笔 <input id="size" type="range" min="1" max="50" value="8"></label><label>叠加 <input id="opacity" type="range" min="0" max="80" value="40"></label><button id="undo">撤销</button><button id="original">恢复初始掩码</button></div>
<div id="views"><div class="view"><div>原图＋标签叠加</div><canvas id="edit" width="640" height="480" aria-label="掩码编辑画布"></canvas></div><div class="view"><div>前景预览（原始像素）</div><canvas id="preview" width="640" height="480" aria-label="黑背景预览"></canvas></div></div>
<div class="bar"><label>修正者 <input id="reviewer" value="user" size="12"></label><button id="save">保存草稿</button><button class="accent" id="review">保存并标记已检查</button><span id="status"></span></div><div id="message" role="status"></div>
<script>
const $=id=>document.getElementById(id), edit=$('edit'), preview=$('preview');
let project,position=0,frame,rgb,labels,history=[],dirty=false,drawing=false,previous=null,polygon=[],busy=false;
const palette=[[0,0,0],[70,225,130],[255,170,50]];
function message(s){$('message').textContent=s}
function status(){ $('status').textContent=`${frame.status==='reviewed'?'已检查':'草稿'} · 修订 ${frame.revision}${dirty?' · 未保存':''}`; }
function image(url){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url})}
function pixels(im){const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);return x.getImageData(0,0,c.width,c.height)}
async function open(index){if(busy){$('frames').value=position;return}if(dirty&&!confirm('当前修改尚未保存，继续切换？')){$('frames').value=position;return}busy=true;frame=project.frames[index];position=index;const [im,mask]=await Promise.all([image(`/images/${frame.id}.png`),image(`/labels/${frame.id}.png?revision=${frame.revision}`)]);rgb=pixels(im);const m=pixels(mask);labels=Uint8Array.from({length:im.width*im.height},(_,i)=>m.data[4*i]);for(const c of [edit,preview]){c.width=im.width;c.height=im.height}history=[];polygon=[];dirty=false;busy=false;$('frames').value=index;$('prev').disabled=index===0;$('next').disabled=index===project.frames.length-1;$('identity').textContent=`episode ${frame.episode} · 原始帧 ${frame.row} · 相机帧号 ${frame.frame_number}`;render();message('')}
function render(){if(!rgb)return;const a=new ImageData(new Uint8ClampedArray(rgb.data),rgb.width,rgb.height),b=new ImageData(rgb.width,rgb.height);const alpha=+$('opacity').value/100;for(let i=0;i<labels.length;i++){const k=labels[i],j=i*4;b.data[j+3]=255;if(k){for(let c=0;c<3;c++){a.data[j+c]=Math.round(a.data[j+c]*(1-alpha)+palette[k][c]*alpha);b.data[j+c]=rgb.data[j+c]}}}const x=edit.getContext('2d');x.putImageData(a,0,0);preview.getContext('2d').putImageData(b,0,0);if(polygon.length){x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();polygon.forEach(([u,v],i)=>i?x.lineTo(u,v):x.moveTo(u,v));x.stroke();for(const [u,v]of polygon){x.fillStyle='#fff';x.fillRect(u-2,v-2,4,4)}}status()}
function point(e){const r=edit.getBoundingClientRect();return[(e.clientX-r.left)*edit.width/r.width,(e.clientY-r.top)*edit.height/r.height]}
function remember(){history.push(labels.slice());if(history.length>30)history.shift()}
function stamp(x,y,k){const radius=+$('size').value/2;for(let v=Math.max(0,Math.floor(y-radius));v<=Math.min(edit.height-1,Math.ceil(y+radius));v++)for(let u=Math.max(0,Math.floor(x-radius));u<=Math.min(edit.width-1,Math.ceil(x+radius));u++)if((u-x)**2+(v-y)**2<=radius**2)labels[v*edit.width+u]=k}
function stroke(a,b,k){const n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])));for(let i=0;i<=n;i++)stamp(a[0]+(b[0]-a[0])*i/n,a[1]+(b[1]-a[1])*i/n,k);dirty=true;render()}
edit.onpointerdown=e=>{if(busy)return;const p=point(e);if($('mode').value==='polygon'){polygon.push(p);render();return}remember();drawing=true;previous=p;edit.setPointerCapture(e.pointerId);stroke(p,p,e.shiftKey?0:+$('cls').value)};
edit.onpointermove=e=>{if(!drawing)return;const p=point(e);stroke(previous,p,e.shiftKey?0:+$('cls').value);previous=p};edit.onpointerup=()=>{drawing=false};edit.onpointercancel=()=>{drawing=false};
function fillPolygon(){if(polygon.length<3)return;remember();const c=document.createElement('canvas');c.width=edit.width;c.height=edit.height;const x=c.getContext('2d');x.fillStyle='white';x.beginPath();polygon.forEach(([u,v],i)=>i?x.lineTo(u,v):x.moveTo(u,v));x.closePath();x.fill();const p=x.getImageData(0,0,c.width,c.height).data;for(let i=0;i<labels.length;i++)if(p[i*4+3]>=128)labels[i]=+$('cls').value;polygon=[];dirty=true;render()}
document.onkeydown=e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.key==='Enter'){e.preventDefault();fillPolygon()}if(e.key==='Escape'){polygon=[];render()}if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();$('undo').click()}};
$('undo').onclick=()=>{if(history.length){labels=history.pop();dirty=true;polygon=[];render()}};$('opacity').oninput=render;$('prev').onclick=()=>open(position-1);$('next').onclick=()=>open(position+1);$('frames').onchange=e=>open(+e.target.value);
$('original').onclick=async()=>{if(!confirm('恢复这张图的初始 SAM3 标签？'))return;remember();const p=pixels(await image(`/initial_labels/${frame.id}.png`));labels=Uint8Array.from({length:labels.length},(_,i)=>p.data[i*4]);dirty=true;render()};
async function save(reviewed){if(busy)return;if(polygon.length){message('先按 Enter 完成多边形，或按 Esc 取消。');return}busy=true;try{const c=document.createElement('canvas');c.width=edit.width;c.height=edit.height;const x=c.getContext('2d'),p=x.createImageData(c.width,c.height);for(let i=0;i<labels.length;i++){p.data[i*4]=p.data[i*4+1]=p.data[i*4+2]=labels[i];p.data[i*4+3]=255}x.putImageData(p,0,0);const response=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:frame.id,revision:frame.revision,reviewer:$('reviewer').value,png:c.toDataURL('image/png'),reviewed})});const result=await response.json();if(!response.ok)throw Error(result.error);frame=result;project.frames[position]=frame;dirty=false;$('frames').options[position].textContent=`${frame.status==='reviewed'?'✓':'○'} ${frame.episode} / ${frame.row}`;status();message('已保存；原始 RGB 和时间戳未修改。')}catch(e){message(e.message)}finally{busy=false}}
$('save').onclick=()=>save(false);$('review').onclick=()=>save(true);window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
fetch('/api/project').then(r=>r.json()).then(p=>{project=p;for(let i=0;i<p.frames.length;i++){const f=p.frames[i],o=document.createElement('option');o.value=i;o.textContent=`${f.status==='reviewed'?'✓':'○'} ${f.episode} / ${f.row}`;$('frames').append(o)}open(0)}).catch(e=>message(e.message));
</script></html>
